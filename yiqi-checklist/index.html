  <title>一起勾｜多人清單</title>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="logo"><span class="logo-mark">✓</span>一起勾</div><span id="account" class="account"></span></div></header>
  <main id="app"></main>
<script>
const BACKEND = location.hostname === "terminal.local" ? location.origin : "https://xiang-checklist.robust-charm-9806.chatgpt.site";
const API = `${BACKEND}/api/external`;
const app = document.getElementById("app");
const account = document.getElementById("account");
const STORAGE_KEY = "yiqi_password_session";
const state = { session: localStorage.getItem(STORAGE_KEY) || "", name: "", canCreatePrivate: false, selected: "", lists: [], detail: null, error: "", message: "", busy: false, drawerOpen: false };
const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);

async function api(action, fields = {}, authenticated = true) {
  const response = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(authenticated && state.session ? { Authorization: `Bearer ${state.session}` } : {}) },
    body: JSON.stringify({ action, ...fields }),
  });
  const data = await response.json();
  if (!response.ok) {
    if (response.status === 401 && authenticated) { state.session = ""; localStorage.removeItem(STORAGE_KEY); }
    throw new Error(data.error || "連線失敗，請稍後重試");
  }
  return data;
}

function alert(message, good = false) {
  return message ? `<div class="notice ${good ? "good" : ""}" role="${good ? "status" : "alert"}">${esc(message)}</div>` : "";
}

function renderAuth() {
  document.body.classList.remove("drawer-open");
  account.textContent = "";
  app.innerHTML = `<div class="center"><section class="welcome"><div class="logo-mark">✓</div><h1>一起勾</h1><p>輸入你的專屬密碼，和朋友一起完成每一件事。</p>${alert(state.error)}<form id="password-form"><label for="password" class="eyebrow">密碼</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required><button class="button" ${state.busy ? "disabled" : ""}>${state.busy ? "登入中…" : "進入清單"}</button></form><p class="help">威翔和 FIFI 各有一組密碼。</p></section></div>`;
}

function renderWorkspace() {
  document.body.classList.toggle("drawer-open", state.drawerOpen);
  account.innerHTML = `<span>${esc(state.name)}</span><button type="button" id="logout-button" aria-label="切換使用者">切換使用者</button>`;
  const selected = state.lists.find(list => list.id === state.selected);
  const detail = state.detail;
  const items = detail?.items || [];
  const done = items.filter(item => item.done).length;
  app.innerHTML = `<div class="workspace"><button type="button" class="sidebar-scrim" id="close-sidebar" aria-label="關閉清單側邊欄" tabindex="-1"></button><aside class="sidebar" id="sidebar" aria-label="所有清單"><div class="sidebar-top"><div class="eyebrow">我的空間</div><button type="button" class="sidebar-close" id="close-sidebar-button" aria-label="關閉清單側邊欄">×</button></div><div class="sidebar-heading"><h1>所有清單</h1>${selected ? `<button type="button" class="delete-list delete-list-trigger" ${state.busy ? "disabled" : ""}>刪除目前清單</button>` : ""}</div><form id="create-form" class="create-form"><div class="create-form-row"><input class="input" name="title" aria-label="新清單名稱" maxlength="120" placeholder="新清單名稱" required><button class="button" aria-label="建立清單">＋</button></div>${state.canCreatePrivate ? `<fieldset class="scope-choices"><legend>誰可以看到？</legend><label><input type="radio" name="visibility" value="shared" checked> 與 FIFI 共享</label><label><input type="radio" name="visibility" value="private"> 🔒 只有威翔</label></fieldset>` : ""}</form>${state.lists.length > 1 ? `<p class="sort-hint">按住清單右側的 ☰ 可拖曳排序</p>` : ""}<nav class="list-nav" aria-label="選擇清單">${state.lists.map(list => `<div class="list-entry"><button type="button" class="list-tab ${list.id === state.selected ? "active" : ""}" data-list="${esc(list.id)}"><span class="list-icon">✓</span><span><strong>${esc(list.title)}${list.visibility === "private" ? " 🔒" : ""}</strong><small>${Number(list.completed)} / ${Number(list.total)} 已完成</small></span></button><button type="button" class="drag-handle" data-drag="${esc(list.id)}" aria-label="按住拖曳「${esc(list.title)}」調整順序" title="拖曳清單排序" ${state.busy ? "disabled" : ""}>☰</button></div>`).join("")}</nav></aside><section class="detail"><button type="button" class="sidebar-toggle" id="open-sidebar" aria-controls="sidebar" aria-expanded="${state.drawerOpen}"><span aria-hidden="true">☰</span> 清單 <span class="sidebar-count">${state.lists.length}</span></button>${alert(state.error)}${alert(state.message, true)}<div id="detail-body"></div></section></div>`;
  const root = document.getElementById("detail-body");
  if (!selected) { root.innerHTML = `<div class="blank"><h2>從一份清單開始</h2><p>點「清單」打開側邊欄，替清單取個名字。</p></div>`; return; }
  if (!detail || detail.list.id !== selected.id) { root.innerHTML = `<div class="blank"><h2>正在開啟清單…</h2></div>`; return; }
  root.innerHTML = `<div class="detail-top"><div><div class="eyebrow">${selected.visibility === "private" ? "🔒 私人清單 · 只有威翔可見" : "與 FIFI 共享的清單"}</div><h2>${esc(selected.title)}</h2><p class="muted">${detail.members.length} 位成員 · ${done} / ${items.length} 項已完成</p></div><button type="button" id="delete-list" class="delete-list" ${state.busy ? "disabled" : ""}>刪除清單</button></div><div class="progress" role="progressbar" aria-label="完成進度" aria-valuenow="${done}" aria-valuemax="${items.length || 1}"><span style="width:${items.length ? done / items.length * 100 : 0}%"></span></div><div class="card"><h3 class="card-title">待完成 <small>${items.length - done}</small>${items.length > 1 ? `<span class="item-sort-hint">按住 ☰ 拖曳排序</span>` : ""}</h3><div id="todo-items"></div><form id="item-form" class="add-form"><span aria-hidden="true">＋</span><input class="input" name="title" aria-label="新增待辦項目" placeholder="新增一個項目…" maxlength="120" required><button class="button" ${state.busy ? "disabled" : ""}>新增</button></form></div>${done ? `<div class="card"><h3 class="card-title">已完成 <small>${done}</small></h3><div id="done-items"></div></div>` : ""}<div class="members">成員<div>${detail.members.map(member => `<span class="pill">${esc(member.name)}</span>`).join("")}</div></div>`;
  const todo = document.getElementById("todo-items");
  const doneRoot = document.getElementById("done-items");
  if (!items.some(item => !item.done)) todo.innerHTML = `<p class="empty-row">${items.length ? "全部完成了，做得好！" : "還沒有項目，從下面新增一件事。"}</p>`;
  for (const item of items) {
    const row = document.createElement("div"); row.className = `item ${item.done ? "done" : ""}`; row.dataset.item = item.id;
    const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.checked = Boolean(item.done); checkbox.disabled = state.busy; checkbox.setAttribute("aria-label", `${item.done ? "取消完成" : "完成"} ${item.title}`);
    checkbox.addEventListener("change", () => void changeItem("setDone", { itemId: item.id, done: checkbox.checked }));
    const name = document.createElement("div"); name.className = "item-name"; name.textContent = item.title;
    if (item.done && item.completedByName) { const by = document.createElement("small"); by.textContent = `${item.completedByName} 完成`; name.appendChild(by); }
    row.append(checkbox, name);
    if (!item.done) { const edit = document.createElement("button"); edit.className = "button plain"; edit.textContent = "編輯"; edit.setAttribute("aria-label", `編輯 ${item.title}`); edit.addEventListener("click", async () => { const next = prompt("修改項目", item.title); if (next && next.trim() && next !== item.title) await changeItem("renameItem", { itemId: item.id, title: next }); }); row.appendChild(edit); }
    const remove = document.createElement("button"); remove.className = "button plain"; remove.textContent = "刪除"; remove.setAttribute("aria-label", `刪除 ${item.title}`); remove.addEventListener("click", async () => { if (confirm(`刪除「${item.title}」？`)) await changeItem("deleteItem", { itemId: item.id }); }); row.appendChild(remove);
    const handle = document.createElement("button"); handle.type = "button"; handle.className = "item-drag-handle"; handle.dataset.itemDrag = item.id; handle.textContent = "☰"; handle.disabled = state.busy; handle.setAttribute("aria-label", `按住拖曳「${item.title}」調整順序`); row.appendChild(handle);
    (item.done ? doneRoot : todo).appendChild(row);
  }
}

function render() { !state.session ? renderAuth() : renderWorkspace(); }

async function load(quiet = false) {
  if (!state.session) { render(); return; }
  try {
    const [who, lists] = await Promise.all([api("whoami"), api("lists")]);
    state.name = who.name; state.canCreatePrivate = Boolean(who.canCreatePrivate); state.lists = lists.lists;
    if (!state.lists.some(list => list.id === state.selected)) state.selected = state.lists[0]?.id || "";
    state.detail = state.selected ? await api("detail", { listId: state.selected }) : null;
    if (!quiet) state.error = "";
  } catch (error) { if (!quiet) state.error = error.message; }
  render();
}

async function mutate(action, fields, success) {
  if (state.busy) return;
  state.busy = true; state.error = ""; state.message = "";
  try { const result = await api(action, fields); if (success) await success(result); await load(); }
  catch (error) { state.error = error.message; render(); }
  finally { state.busy = false; render(); }
}
async function changeItem(action, fields) { await mutate(action, { listId: state.selected, ...fields }); }

async function persistListOrder(ids) {
  const previous = state.lists;
  const byId = new Map(previous.map(list => [list.id, list]));
  state.lists = ids.map(id => byId.get(id));
  state.busy = true;
  state.error = "";
  render();
  try { await api("reorderLists", { listIds: ids }); await load(); }
  catch (error) { state.lists = previous; state.error = error.message; }
  finally { state.busy = false; render(); }
}

async function persistItemOrder(ids) {
  const detail = state.detail;
  if (!detail) return;
  const previous = detail.items;
  const byId = new Map(previous.map(item => [item.id, item]));
  detail.items = ids.map(id => byId.get(id));
  state.busy = true;
  state.error = "";
  render();
  try { await api("reorderItems", { listId: state.selected, itemIds: ids }); await load(); }
  catch (error) { detail.items = previous; state.error = error.message; }
  finally { state.busy = false; render(); }
}

let dragging = null;
app.addEventListener("pointerdown", event => {
  const handle = event.target.closest("[data-drag], [data-item-drag]");
  if (!handle || dragging || state.busy || (event.pointerType === "mouse" && event.button !== 0)) return;
  event.preventDefault();
  const kind = handle.hasAttribute("data-item-drag") ? "item" : "list";
  const entry = handle.closest(kind === "item" ? ".item" : ".list-entry");
  const container = entry.parentElement;
  const originalOrder = kind === "item" ? [...container.querySelectorAll(".item[data-item]")].map(row => row.dataset.item) : null;
  dragging = { pointerId: event.pointerId, handle, entry, container, kind, originalOrder, x: event.clientX, y: event.clientY, moved: false };
  handle.setPointerCapture(event.pointerId);
  entry.classList.add("dragging");
});
app.addEventListener("pointermove", event => {
  if (!dragging || dragging.pointerId !== event.pointerId) return;
  event.preventDefault();
  if (!dragging.moved && Math.hypot(event.clientX - dragging.x, event.clientY - dragging.y) < 8) return;
  dragging.moved = true;
  const container = dragging.container;
  const bounds = container.getBoundingClientRect();
  const horizontal = dragging.kind === "list" && getComputedStyle(container).display === "flex";
  if (horizontal) {
    if (event.clientX > bounds.right - 28) container.scrollLeft += 18;
    if (event.clientX < bounds.left + 28) container.scrollLeft -= 18;
  }
  const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(dragging.kind === "item" ? ".item[data-item]" : ".list-entry");
  if (!target || target === dragging.entry || target.parentElement !== container) return;
  const rect = target.getBoundingClientRect();
  const before = horizontal ? event.clientX < rect.left + rect.width / 2 : event.clientY < rect.top + rect.height / 2;
  container.insertBefore(dragging.entry, before ? target : target.nextSibling);
});
function finishDrag(event) {
  if (!dragging || dragging.pointerId !== event.pointerId) return;
  const { entry, handle, container, kind, originalOrder, moved } = dragging;
  dragging = null;
  if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
  entry.classList.remove("dragging");
  if (event.type === "pointercancel") { render(); return; }
  if (!moved) return;
  if (kind === "item") {
    const currentOrder = [...container.querySelectorAll(".item[data-item]")].map(row => row.dataset.item);
    if (currentOrder.some((id, index) => id !== originalOrder[index])) {
      const ids = [...app.querySelectorAll("#todo-items .item[data-item], #done-items .item[data-item]")].map(row => row.dataset.item);
      void persistItemOrder(ids);
    }
    return;
  }
  const ids = [...app.querySelectorAll(".list-nav [data-list]")].map(button => button.dataset.list);
  if (ids.some((id, index) => id !== state.lists[index]?.id)) void persistListOrder(ids);
}
app.addEventListener("pointerup", finishDrag);
app.addEventListener("pointercancel", finishDrag);
app.addEventListener("keydown", event => {
  const handle = event.target.closest("[data-drag], [data-item-drag]");
  if (!handle || state.busy || !["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) return;
  event.preventDefault();
  if (handle.hasAttribute("data-item-drag")) {
    if (!["ArrowUp", "ArrowDown"].includes(event.key)) return;
    const container = handle.closest(".item").parentElement;
    const rows = [...container.querySelectorAll(".item[data-item]")];
    const index = rows.findIndex(row => row.dataset.item === handle.dataset.itemDrag);
    const target = index + (event.key === "ArrowUp" ? -1 : 1);
    if (target < 0 || target >= rows.length) return;
    container.insertBefore(rows[index], target < index ? rows[target] : rows[target].nextSibling);
    const ids = [...app.querySelectorAll("#todo-items .item[data-item], #done-items .item[data-item]")].map(row => row.dataset.item);
    void persistItemOrder(ids);
    return;
  }
  const index = state.lists.findIndex(list => list.id === handle.dataset.drag);
  const target = index + (["ArrowLeft", "ArrowUp"].includes(event.key) ? -1 : 1);
  if (target < 0 || target >= state.lists.length) return;
  const ids = state.lists.map(list => list.id);
  [ids[index], ids[target]] = [ids[target], ids[index]];
  void persistListOrder(ids);
});

app.addEventListener("click", async event => {
  if (event.target.closest("#open-sidebar")) { state.drawerOpen = true; render(); document.getElementById("close-sidebar-button")?.focus(); return; }
  if (event.target.closest("#close-sidebar, #close-sidebar-button")) { state.drawerOpen = false; render(); document.getElementById("open-sidebar")?.focus(); return; }
  if (event.target.closest("#delete-list, .delete-list-trigger")) {
    const selected = state.lists.find(list => list.id === state.selected);
    if (!selected || state.busy) return;
    if (!confirm(selected.visibility === "private" ? `確定刪除私人清單「${selected.title}」和裡面的所有項目嗎？無法復原。` : `確定刪除「${selected.title}」和裡面的所有項目嗎？兩人的清單都會移除，無法復原。`)) return;
    await mutate("deleteList", { listId: selected.id }, () => { state.selected = ""; state.detail = null; state.drawerOpen = false; });
    return;
  }
  const list = event.target.closest("[data-list]");
  if (list) { state.selected = list.dataset.list; state.detail = null; state.drawerOpen = false; render(); await load(); }
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && state.drawerOpen) { state.drawerOpen = false; render(); document.getElementById("open-sidebar")?.focus(); }
});
account.addEventListener("click", event => {
  if (event.target.id !== "logout-button") return;
  localStorage.removeItem(STORAGE_KEY); state.session = ""; state.name = ""; state.canCreatePrivate = false; state.lists = []; state.detail = null; state.selected = ""; state.error = ""; state.drawerOpen = false; render();
});

app.addEventListener("submit", async event => {
  event.preventDefault();
  const form = event.target;
  if (form.id === "password-form") {
    const password = form.elements.password.value; state.busy = true; state.error = ""; render();
    try { const data = await api("passwordLogin", { password }, false); state.session = data.session; localStorage.setItem(STORAGE_KEY, data.session); await load(); }
    catch (error) { state.error = error.message; }
    state.busy = false; render(); return;
  }
  if (form.id === "create-form") { const title = form.elements.title.value.trim(); const visibility = form.elements.visibility?.value || "shared"; if (title) await mutate("createList", { title, visibility }, result => { state.selected = result.id; state.detail = null; state.drawerOpen = false; }); }
  if (form.id === "item-form") { const title = form.elements.title.value.trim(); if (title) await changeItem("addItem", { title }); }
});

render();
if (state.session) void load();
setInterval(() => { if (state.session && !document.hidden && !state.drawerOpen && document.activeElement?.tagName !== "INPUT" && !state.busy && !dragging) void load(true); }, 4000);

</script>
</body>
</html>
